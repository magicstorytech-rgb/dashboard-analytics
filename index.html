<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard TRIPE - Ultra Analytics v10.7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0e27;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1729 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .title {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }
        
        .filters {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .filter-btn {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }
        
        .online-badge {
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid #22c55e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .online-label {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .online-count {
            font-size: 56px;
            font-weight: 900;
            color: #22c55e;
            text-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
        }
        
        .stats-section {
            background: #0f1729;
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .section-title {
            color: #6366f1;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat-card {
            background: rgba(99, 102, 241, 0.05);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            color: #fff;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 5px;
        }
        
        .stat-percent {
            color: #6366f1;
            font-size: 13px;
            font-weight: 600;
        }
        
        .quiz-retention {
            background: #0f1729;
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .quiz-stats {
            display: grid;
            gap: 15px;
        }
        
        .quiz-row {
            background: rgba(99, 102, 241, 0.05);
            border-left: 3px solid #6366f1;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .quiz-step {
            color: #e2e8f0;
            font-weight: 600;
            font-size: 14px;
        }
        
        .quiz-count {
            color: #6366f1;
            font-size: 20px;
            font-weight: 800;
        }
        
        .spy-section {
            background: #0f1729;
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 25px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .spy-item {
            background: rgba(99, 102, 241, 0.05);
            border-left: 3px solid #22c55e;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            animation: slideIn 0.4s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .spy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .spy-id {
            color: #a5b4fc;
            font-weight: 700;
            font-size: 13px;
        }
        
        .spy-time {
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
        }
        
        .spy-status {
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
        }
        
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
            50% { opacity: 0.6; box-shadow: 0 0 4px rgba(34, 197, 94, 0.3); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 14px;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 41, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }
        
        .loading-spinner {
            border: 3px solid rgba(99, 102, 241, 0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title"># ANALYTICS V10.7</div>
            <div class="subtitle">Monitoramento e Filtro de Visão</div>
            <div class="filters">
                <button class="filter-btn">RESETAR VISÃO</button>
            </div>
        </div>

        <div class="online-badge">
            <div class="online-label">Online Agora</div>
            <div class="online-count" id="online-now">0</div>
        </div>

        <div class="stats-section">
            <div class="section-title">
                <span>📊</span> Acessos (Visão Atual)
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Acessos</div>
                    <div class="stat-value" id="total-visits">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Passou Instrução</div>
                    <div class="stat-value" id="passed-instruction">0</div>
                    <div class="stat-percent" id="passed-instruction-pct">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Clicou VSL</div>
                    <div class="stat-value" id="clicked-vsl">0</div>
                    <div class="stat-percent" id="clicked-vsl-pct">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Iniciou Quiz</div>
                    <div class="stat-value" id="started-quiz">0</div>
                    <div class="stat-percent" id="started-quiz-pct">0%</div>
                </div>
            </div>
        </div>

        <div class="quiz-retention">
            <div class="section-title">
                <span>📝</span> Retenção do Quiz
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="stat-card">
                    <div class="stat-label">Leads (Visão Atual)</div>
                    <div class="stat-value" id="total-leads">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Taxa de Conclusão</div>
                    <div class="stat-value" id="completion-rate">0%</div>
                </div>
            </div>
            <div class="stat-card" style="text-align: left; margin-bottom: 20px;">
                <div class="stat-label">Maior Abandono</div>
                <div style="color: #ef4444; font-size: 18px; font-weight: 700; margin-top: 5px;" id="highest-dropout">--</div>
            </div>
        </div>

        <div class="spy-section">
            <div class="section-title">
                <span>🔴</span> Espião de Fluxo (Tempo Real)
            </div>
            <div id="spy-container">
                <div class="empty-state">
                    <div class="loading-spinner"></div>
                    <div>Aguardando novos leads...</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, query, onSnapshot, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyB-GPkmK_iNQuu_96NsWBEmnZA1LhiSRR4",
            authDomain: "alytics-metodo-alpha.firebaseapp.com",
            projectId: "alytics-metodo-alpha",
            storageBucket: "alytics-metodo-alpha.firebasestorage.app",
            messagingSenderId: "389989039442",
            appId: "1:389989039442:web:e897945ffbfe52da210e8b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allSessions = [];

        function isOnline(lastActivity) {
            if (!lastActivity) return false;
            const now = Date.now();
            const lastTime = lastActivity.toMillis ? lastActivity.toMillis() : lastActivity;
            return (now - lastTime) < 120000;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '--:--';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function getStatusText(session) {
            if (session.events?.checkout_clicked) return '💳 Clicou para CHECKOUT';
            if (session.events?.processing_completed) return '🎯 Visualizando Oferta';
            if (session.events?.quiz_completed) return '✅ Completou Quiz (15/15)';
            if (session.events?.quiz_started) return `📝 Respondendo Quiz (${session.quizProgress || 1}/15)`;
            if (session.events?.vsl_clicked) return '▶️ Clicou no VSL';
            if (session.events?.instruction_completed) return '👁️ Passou da Instrução';
            return '📱 Visualizando Página Inicial';
        }

        function updateStats() {
            const total = allSessions.length;
            const online = allSessions.filter(s => isOnline(s.lastActivity)).length;
            const passedInstruction = allSessions.filter(s => s.events?.instruction_completed).length;
            const clickedVSL = allSessions.filter(s => s.events?.vsl_clicked).length;
            const startedQuiz = allSessions.filter(s => s.events?.quiz_started).length;
            const completedQuiz = allSessions.filter(s => s.events?.quiz_completed).length;
            const clickedCheckout = allSessions.filter(s => s.events?.checkout_clicked).length;

            document.getElementById('online-now').textContent = online;
            document.getElementById('total-visits').textContent = total;
            document.getElementById('passed-instruction').textContent = passedInstruction;
            document.getElementById('clicked-vsl').textContent = clickedVSL;
            document.getElementById('started-quiz').textContent = startedQuiz;
            document.getElementById('total-leads').textContent = startedQuiz;

            document.getElementById('passed-instruction-pct').textContent = 
                total > 0 ? Math.round((passedInstruction / total) * 100) + '%' : '0%';
            document.getElementById('clicked-vsl-pct').textContent = 
                total > 0 ? Math.round((clickedVSL / total) * 100) + '%' : '0%';
            document.getElementById('started-quiz-pct').textContent = 
                total > 0 ? Math.round((startedQuiz / total) * 100) + '%' : '0%';
            
            const completionRate = startedQuiz > 0 ? Math.round((completedQuiz / startedQuiz) * 100) : 0;
            document.getElementById('completion-rate').textContent = completionRate + '%';

            const dropouts = {
                'Instrução': total - passedInstruction,
                'VSL': passedInstruction - clickedVSL,
                'Quiz Início': clickedVSL - startedQuiz,
                'Quiz Final': startedQuiz - completedQuiz,
                'Checkout': completedQuiz - clickedCheckout
            };
            
            const maxDropout = Object.entries(dropouts).reduce((max, [key, val]) => 
                val > max.val ? {stage: key, val} : max, 
                {stage: '--', val: 0}
            );
            
            document.getElementById('highest-dropout').textContent = 
                maxDropout.val > 0 ? `${maxDropout.stage} (${maxDropout.val} pessoas)` : '--';
        }

        function updateSpyFeed() {
            const container = document.getElementById('spy-container');
            
            const sortedSessions = [...allSessions].sort((a, b) => {
                const timeA = a.lastActivity?.toMillis ? a.lastActivity.toMillis() : 0;
                const timeB = b.lastActivity?.toMillis ? b.lastActivity.toMillis() : 0;
                return timeB - timeA;
            });

            const recentSessions = sortedSessions.slice(0, 30);

            if (recentSessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="loading-spinner"></div>
                        <div>Aguardando novos leads...</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = recentSessions.map(session => {
                const online = isOnline(session.lastActivity);
                const shortId = session.sessionId ? session.sessionId.substr(-8).toUpperCase() : 'UNKNOWN';
                return `
                    <div class="spy-item">
                        <div class="spy-header">
                            <div class="spy-id">
                                ${online ? '<span class="online-dot"></span>' : ''}
                                Lead #${shortId}
                            </div>
                            <div class="spy-time">${formatTime(session.enteredAt)}</div>
                        </div>
                        <div class="spy-status">${getStatusText(session)}</div>
                    </div>
                `;
            }).join('');
        }

        const q = query(collection(db, 'sessions'), orderBy('enteredAt', 'desc'));
        
        onSnapshot(q, (snapshot) => {
            allSessions = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            updateStats();
            updateSpyFeed();
        });

        setInterval(() => {
            updateStats();
            updateSpyFeed();
        }, 30000);
    </script>
</body>
</html>
