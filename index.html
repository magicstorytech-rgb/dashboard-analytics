<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard TRIPE - Ultra Analytics v10.7</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d0000 100%);
            border: 2px solid #cc0000;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(204, 0, 0, 0.3);
        }
        
        .title {
            font-size: 32px;
            font-weight: 900;
            color: #ff3333;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.5);
        }
        
        .subtitle {
            color: #cccccc;
            font-size: 14px;
            font-weight: 500;
        }
        
        .online-badge {
            background: rgba(204, 0, 0, 0.15);
            border: 2px solid #cc0000;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.2);
        }
        
        .online-label {
            color: #cccccc;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .online-count {
            font-size: 56px;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 30px rgba(255, 51, 51, 0.6);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stats-section {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d0000 100%);
            border: 2px solid #cc0000;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.2);
        }
        
        .section-title {
            color: #ff3333;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .stat-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #333333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            border-color: #cc0000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.3);
        }
        
        .stat-label {
            color: #999999;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            color: #ffffff;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 5px;
        }
        
        .stat-percent {
            color: #ff3333;
            font-size: 13px;
            font-weight: 600;
        }
        
        .chart-and-retention {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d0000 100%);
            border: 2px solid #cc0000;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.2);
        }
        
        .chart-wrapper {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        
        .quiz-retention {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d0000 100%);
            border: 2px solid #cc0000;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.2);
        }
        
        .quiz-stats {
            display: grid;
            gap: 8px;
            max-height: 340px;
            overflow-y: auto;
        }
        
        .quiz-row {
            background: rgba(0, 0, 0, 0.5);
            border-left: 4px solid #cc0000;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .quiz-row:hover {
            background: rgba(204, 0, 0, 0.1);
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.2);
        }
        
        .quiz-step {
            color: #ffffff;
            font-weight: 600;
        }
        
        .quiz-count {
            color: #ff3333;
            font-size: 14px;
            font-weight: 800;
        }
        
        .spy-section-title {
            color: #ff3333;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }
        
        .spy-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .spy-column {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d0000 100%);
            border: 2px solid #cc0000;
            border-radius: 12px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.2);
        }
        
        .spy-item {
            background: rgba(0, 0, 0, 0.5);
            border-left: 4px solid #ff3333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 12px;
            animation: slideIn 0.4s ease;
            transition: all 0.3s;
        }
        
        .spy-item:hover {
            background: rgba(204, 0, 0, 0.1);
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.3);
        }
        
        .spy-item.checkout {
            border-left: 4px solid #00ff00;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            animation: checkoutPulse 0.6s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes checkoutPulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .spy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .spy-id {
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
        }
        
        .spy-time {
            color: #999999;
            font-size: 11px;
            font-weight: 600;
        }
        
        .spy-status {
            color: #cccccc;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .spy-status.checkout {
            color: #00ff00;
            font-weight: 700;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: #cc0000; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff3333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">ANALYTICS <span style="color: #fff;">V10.7</span></h1>
            <p class="subtitle">Monitoramento e Filtro de Visão em Tempo Real (Fluxo Simplificado)</p>
        </div>

        <div class="online-badge">
            <div class="online-label"><span class="online-dot"></span>Online Agora</div>
            <div class="online-count" id="online-count">0</div>
        </div>

        <div class="main-grid">
            <div class="stats-section">
                <div class="section-title">Métricas de Conversão</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total de Leads</div>
                        <div class="stat-value" id="total-leads">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Taxa de Conclusão</div>
                        <div class="stat-value" id="completion-rate">0%</div>
                    </div>
                </div>
            </div>
            <div class="stats-section">
                <div class="section-title">Ponto Crítico</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Maior Abandono</div>
                        <div class="stat-value" id="top-dropoff" style="color: #ff3333;">N/A</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-and-retention">
            <div class="chart-container">
                <div class="section-title">Acessos (Últimas 24h)</div>
                <div class="chart-wrapper">
                    <canvas id="chart24h"></canvas>
                </div>
            </div>
            <div class="quiz-retention">
                <div class="section-title">Retenção do Quiz</div>
                <div class="quiz-stats" id="quiz-retention-list">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

        <div class="spy-section-title">Espião de Fluxo (Tempo Real)</div>
        <div class="spy-columns" id="live-feed">
            <!-- Injected by JS -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCrUYYLb_9p4QUq1JLqQUwWEx-GgWEoTxQ",
            authDomain: "funil-tripe-v10.firebaseapp.com",
            databaseURL: "https://funil-tripe-v10-default-rtdb.firebaseio.com",
            projectId: "funil-tripe-v10",
            storageBucket: "funil-tripe-v10.firebasestorage.app",
            messagingSenderId: "872809369468",
            appId: "1:872809369468:web:e372a48b9654739098def9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const sessionsRef = ref(db, 'sessions');

        let accessChart;

        function initCharts() {
            const ctxAccess = document.getElementById('chart24h').getContext('2d');
            accessChart = new Chart(ctxAccess, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [{
                        data: new Array(24).fill(0).map(() => Math.floor(Math.random() * 50)),
                        borderColor: '#ff3333',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(255, 51, 51, 0.1)',
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false },
                        x: { grid: { display: false }, ticks: { color: '#444' } }
                    }
                }
            });
        }

        onValue(sessionsRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const sessions = Object.values(data);
            const now = Date.now();
            
            const online = sessions.filter(s => (now - (s.enteredAt || 0)) < 300000).length;
            document.getElementById('online-count').innerText = online;
            document.getElementById('total-leads').innerText = sessions.length;

            const retention = new Array(15).fill(0);
            let checkouts = 0;
            let startedQuiz = 0;

            sessions.forEach(s => {
                if (s.currentStep > 0) {
                    startedQuiz++;
                    for (let i = 0; i < s.currentStep && i < 15; i++) {
                        retention[i]++;
                    }
                }
                if (s.status === 'checkout_clicked') checkouts++;
            });

            // Update Retention List
            const retentionList = document.getElementById('quiz-retention-list');
            retentionList.innerHTML = retention.map((count, i) => `
                <div class="quiz-row">
                    <span class="quiz-step">Pergunta ${i+1}</span>
                    <span class="quiz-count">${count}</span>
                </div>
            `).join('');

            const rate = startedQuiz > 0 ? ((checkouts / startedQuiz) * 100).toFixed(1) : 0;
            document.getElementById('completion-rate').innerText = `${rate}%`;

            let maxDrop = 0;
            let dropStep = "N/A";
            for (let i = 0; i < 14; i++) {
                const drop = retention[i] - retention[i+1];
                if (drop > maxDrop) {
                    maxDrop = drop;
                    dropStep = `Q${i+1}`;
                }
            }
            document.getElementById('top-dropoff').innerText = dropStep;

            const feed = document.getElementById('live-feed');
            const sortedSessions = sessions.sort((a, b) => (b.enteredAt || 0) - (a.enteredAt || 0)).slice(0, 12);
            
            feed.innerHTML = sortedSessions.map(s => {
                const timeAgo = Math.floor((now - (s.enteredAt || 0)) / 60000);
                let statusText = s.status || "VSL VIEWED";
                let isCheckout = s.status === 'checkout_clicked';
                
                if (isCheckout) {
                    statusText = "🔥 NO CHECKOUT";
                } else if (s.currentStep > 0) {
                    statusText = `QUIZ (${s.currentStep}/15)`;
                }

                return `
                    <div class="spy-item ${isCheckout ? 'checkout' : ''}">
                        <div class="spy-header">
                            <span class="spy-id">ID: ${s.enteredAt ? s.enteredAt.toString().slice(-6) : '---'}</span>
                            <span class="spy-time">${timeAgo} min atrás</span>
                        </div>
                        <div class="spy-status ${isCheckout ? 'checkout' : ''}">${statusText}</div>
                    </div>
                `;
            }).join('');
        });

        window.onload = initCharts;
    </script>
</body>
</html>
